                  raise SystemExit(f'Stale itinerary marker still present: {marker}')

          path.write_text(text)

      - name: Commit synced itinerary to main
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already matches the current Notion itinerary."
            exit 0
          fi
          git config user.name "trip-plan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Sync current Notion itinerary to HTML"
          git push origin main
