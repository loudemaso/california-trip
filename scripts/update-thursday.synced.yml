name: Sync Notion itinerary

on:
  push:
    paths:
      - '.github/workflows/update-thursday.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync current Notion itinerary into index.html
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          def replace_day(text, date_label, next_date_label, new_section):
              start_marker = f'<section class="day"><div class="dayhead"><div><div class="date">{date_label}</div>'
              next_marker = f'<section class="day"><div class="dayhead"><div><div class="date">{next_date_label}</div>'
              start = text.find(start_marker)
              if start == -1:
                  raise SystemExit(f'Could not find day start: {date_label}')
              end = text.find(next_marker, start)
              if end == -1:
                  raise SystemExit(f'Could not find next day start: {next_date_label}')
              return text[:start] + new_section + text[end:]

          tuesday = '''<section class="day"><div class="dayhead"><div><div class="date">Tuesday · September 15</div><h2>Touchdown + Pacific</h2></div><div class="dayicon">🌴</div></div><p class="weather"><strong>Weather:</strong> Mild morning; warm afternoon around the upper 70s with little rain concern; comfortable evening in the upper 60s/low 70s.</p><p class="note">Day-one energy: land, acquire Porsche, then head downtown for architecture, wandering, a very specific lemon-shaped dessert mission, and a late Greek dinner in Coronado.</p><div class="timeline"><div class="activity no-media"><div class="content"><div class="time">11:35 AM–1:01 PM</div><h3>United flight DEN → SAN</h3><p>We'll launch ourselves out of Denver and land in San Diego ready to trade mountain air for Pacific air. Vacation mode begins the second we step off the plane.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=3225+N+Harbor+Dr+San+Diego+CA+92101" target="_blank" rel="noopener">📍 San Diego International Airport · 3225 N Harbor Dr, San Diego, CA 92101</a><span class="travel">Flight · no drive</span></div></div></div><div class="activity no-media"><div class="content"><div class="time">1:01–2:15 PM</div><h3>Airport transfer + Turo pickup</h3><p>We'll collect our bags, Uber to La Jolla, and take possession of our handsome Porsche like two people who are absolutely qualified to be this glamorous. Sebastian's Macan becomes our temporary California personality.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=7464+Draper+Ave+La+Jolla+CA+92037" target="_blank" rel="noopener">📍 7464 Draper Ave, La Jolla, CA 92037</a><span class="travel">🚗 25 min drive</span></div></div></div><div class="activity"><div class="content"><div class="time">2:15–4:15 PM</div><h3>Scenic Highway 101 drive to Carlsbad + hotel check-in</h3><p>Instead of taking I-5 straight north, we'll make the Porsche earn its vacation credentials by following the coast through Torrey Pines, Del Mar, Solana Beach, Cardiff-by-the-Sea and Encinitas before continuing into Carlsbad. We'll treat the drive itself as sightseeing, then check into Home2 Suites and get settled before heading back into San Diego.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=1901+Wright+Pl+Carlsbad+CA+92008" target="_blank" rel="noopener">📍 Home2 Suites by Hilton Carlsbad · 1901 Wright Pl, Carlsbad, CA 92008</a><span class="travel">≈1 hr 15–1 hr 30 scenic drive + hotel check-in buffer</span></div></div><div class="media"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Along%20Hwy%20101%20-%20panoramio.jpg?width=1200" alt="Scenic Highway 101 along the Encinitas coast" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80'"></div></div><div class="activity no-media"><div class="content"><div class="time">4:15–5:00 PM</div><h3>Drive Carlsbad → Balboa Park</h3><p>After checking in, we'll point the Porsche back south and head into central San Diego while there's still plenty of daylight for the park.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=1549+El+Prado+San+Diego+CA+92101" target="_blank" rel="noopener">📍 Balboa Park · 1549 El Prado, San Diego, CA 92101</a><span class="travel">≈45 min drive + parking buffer</span></div></div></div><div class="activity"><div class="content"><div class="time">5:00–6:20 PM</div><h3>Balboa Park golden-hour wander</h3><p>We'll explore El Prado, the gardens, Spanish Colonial architecture and outdoor spaces rather than trying to squeeze museums into a short first-day visit.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=1549+El+Prado+San+Diego+CA+92101" target="_blank" rel="noopener">📍 Balboa Park · 1549 El Prado, San Diego, CA 92101</a><span class="travel">0 min drive</span></div></div><div class="media"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Balboa%20Park%20San%20Diego.jpg?width=1200" alt="Balboa Park in San Diego" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80'"></div></div><div class="activity no-media"><div class="content"><div class="time">6:20–6:35 PM</div><h3>Drive Balboa Park → Little Italy + park</h3><p>It's only a few miles away, but we'll give ourselves a proper downtown parking buffer before switching to walking for the rest of the evening.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=India+St+and+W+Date+St+San+Diego+CA+92101" target="_blank" rel="noopener">📍 India St &amp; W Date St, San Diego, CA 92101</a><span class="travel">≈15 min drive + parking</span></div></div></div><div class="activity"><div class="content"><div class="time">6:35–7:35 PM</div><h3>Little Italy wander</h3><p>We'll stroll India Street and the piazzas, browse whatever catches our attention, and soak up the neighborhood before our later dinner reservation in Coronado.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=India+St+and+W+Date+St+San+Diego+CA+92101" target="_blank" rel="noopener">📍 India St &amp; W Date St, San Diego, CA 92101</a><span class="travel">Park once · explore on foot</span></div></div><div class="media"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Little%20Italy%2C%20San%20Diego.jpg?width=1200" alt="Little Italy in San Diego" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&amp;fit=crop&amp;w=900&amp;q=80'"></div></div><div class="activity"><div class="content"><div class="time">7:35–7:55 PM</div><h3>Allegro — Amalfi Lemon Sorbet</h3><p>We'll make the delightfully questionable decision to have the photogenic Amalfi-style lemon sorbet before dinner, then head for Coronado.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=1536+India+St+San+Diego+CA+92101" target="_blank" rel="noopener">📍 Allegro Restaurant and Bar · 1536 India St, San Diego, CA 92101</a><span class="travel">Walk within Little Italy</span></div></div><div class="media"><img src="https://cdn.res-menu.net/allegro-restaurant-and-bar/albums-1.jpg" alt="Allegro lemon garden dining room in Little Italy" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&amp;fit=crop&amp;w=900&amp;q=80'"></div></div><div class="activity no-media"><div class="content"><div class="time">7:55–8:25 PM</div><h3>Drive Little Italy → Night Hawk + arrival buffer</h3><p>We'll cross over to Coronado with enough time to park or use valet and make the reservation without rushing.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=1315+Orange+Ave+Coronado+CA+92118" target="_blank" rel="noopener">📍 Night Hawk · 1315 Orange Ave, Coronado, CA 92118</a><span class="travel">≈20 min drive + arrival buffer</span></div></div></div><div class="activity"><div class="content"><div class="time">8:30–10:00 PM</div><h3>Night Hawk — open-air Greek date night</h3><p>We'll settle into the outdoor dining room for a late Greek dinner and let the first night finish somewhere atmospheric instead of trying to squeeze in another neighborhood.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=1315+Orange+Ave+Coronado+CA+92118" target="_blank" rel="noopener">📍 Night Hawk · 1315 Orange Ave, Coronado, CA 92118</a></div><div class="pills"><a class="pill confirmed" href="https://www.thebabygrandcoronado.com/night-hawk" target="_blank" rel="noopener">✅ Reservation confirmed · Tue Sep 15 · 8:30 PM · 2 guests · outdoor seating</a></div></div><div class="media"><img src="https://www.thebabygrandcoronado.com/_vercel/image?q=90&amp;url=https%3A%2F%2Fcms.thebabygrandcoronado.com%2Fuploads%2Fnhk1.jpg&amp;w=640" alt="Night Hawk — open-air Greek date night" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&amp;fit=crop&amp;w=900&amp;q=80'"></div></div><div class="activity no-media"><div class="content"><div class="time">10:00–10:50 PM</div><h3>Drive Night Hawk → Carlsbad hotel</h3><p>After dinner, we'll head straight back to Home2 Suites and call it a very respectable first day.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=1901+Wright+Pl+Carlsbad+CA+92008" target="_blank" rel="noopener">📍 Home2 Suites by Hilton Carlsbad · 1901 Wright Pl, Carlsbad, CA 92008</a><span class="travel">≈50 min drive</span></div></div></div></div></section>'''

          wednesday = '''<section class="day"><div class="dayhead"><div><div class="date">Wednesday · September 16</div><h2>Adulting, then beach</h2></div><div class="dayicon">🫡</div></div><p class="weather"><strong>Weather:</strong> Mild morning, warm/dry afternoon near the upper 70s, and comfortable evening; low rain concern makes this a strong beach day.</p><p class="note">A tiny amount of responsible-adult business, followed by an aggressively irresponsible amount of beach time.</p><div class="timeline"><div class="activity no-media"><div class="content"><div class="time">8:50–10:00 AM</div><h3>California sales-license fingerprinting</h3><p>I'll handle the responsible-adult portion of the morning and get my fingerprints taken while you bravely support my brief career as a person with paperwork. Then we'll be free to return to vacation behavior.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=2888+Loker+Ave+E+Suite+110+Carlsbad+CA+92010" target="_blank" rel="noopener">📍 2888 Loker Ave E, Suite 110, Carlsbad, CA 92010</a><span class="travel">🚗 5 min drive</span></div><div class="pills"><span class="pill check">Confirm before the trip · bring valid government-issued photo ID + completed Request for Live Scan Service form · appointment/time still needs final confirmation · 442-200-1099</span></div></div></div><div class="activity no-media"><div class="content"><div class="time">10:00 AM–12:45 PM</div><h3>Breakfast + flexible Carlsbad time</h3><p>We'll have a slow breakfast and let the morning breathe instead of cramming in another attraction. This is our official window for coffee, wandering, and pretending we don't have a timeshare presentation later.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=1901+Wright+Pl+Carlsbad+CA+92008" target="_blank" rel="noopener">📍 Home2 Suites by Hilton Carlsbad · 1901 Wright Pl, Carlsbad, CA 92008</a><span class="travel">🚗 5 min drive</span></div></div></div><div class="activity no-media"><div class="content"><div class="time">1:20–3:00 PM</div><h3>Required timeshare presentation</h3><p>We'll go to MarBrisa and complete our required hour and a half of smiling politely while someone explains a lifestyle upgrade we did not ask for. Then we'll accept our vacation benefits and escape back into the sunlight.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=1594+MarBrisa+Cir+Carlsbad+CA+92008" target="_blank" rel="noopener">📍 1594 MarBrisa Cir, Carlsbad, CA 92008</a><span class="travel">🚗 5 min drive</span></div></div></div><div class="activity no-media"><div class="content"><div class="time">3:00–3:10 PM</div><h3>Drive MarBrisa → South Carlsbad State Beach</h3><p>We'll escape the timeshare presentation and head straight for the coast.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=7201+Carlsbad+Blvd+Carlsbad+CA+92008" target="_blank" rel="noopener">📍 South Carlsbad State Beach · 7201 Carlsbad Blvd, Carlsbad, CA 92008</a><span class="travel">🚗 ≈10 min drive</span></div></div></div><div class="activity"><div class="content"><div class="time">3:10–4:35 PM</div><h3>Long Carlsbad beach block</h3><p>We'll settle in for about an hour and 25 minutes of actual beach time and let the ocean rinse the sales presentation out of our brains.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=7201+Carlsbad+Blvd+Carlsbad+CA+92008" target="_blank" rel="noopener">📍 South Carlsbad State Beach · 7201 Carlsbad Blvd, Carlsbad, CA 92008</a><span class="travel">🚗 0 min drive</span></div></div><div class="media"><img src="https://carlsbad.imgix.net/images/carlsbad-beaches2-e1526396235365_2023-04-07-213058_rgeo.jpg?auto=compress%2Cformat&amp;crop=focalpoint&amp;fit=min&amp;fp-x=0.5&amp;fp-y=0.5&amp;h=512&amp;q=80&amp;s=4a7616a40db9c45fa5558b11a6ac1806&amp;w=768" alt="Long Carlsbad beach block" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&amp;fit=crop&amp;w=900&amp;q=80'"></div></div><div class="activity no-media"><div class="content"><div class="time">4:35–4:50 PM</div><h3>Drive beach → Home2 Suites</h3><p>We'll head back to the hotel with enough time to reset without turning the shower into a competitive event.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=1901+Wright+Pl+Carlsbad+CA+92008" target="_blank" rel="noopener">📍 Home2 Suites by Hilton Carlsbad · 1901 Wright Pl, Carlsbad, CA 92008</a><span class="travel">🚗 ≈15 min drive</span></div></div></div><div class="activity no-media"><div class="content"><div class="time">4:50–5:55 PM</div><h3>Hotel reset + change for dinner</h3><p>We'll shower, change, and perform the glamorous transformation from beach gremlins to people ready for a proper Carlsbad dinner. Ideally with minimal sand discovered in mysterious locations.</p><div class="meta"><span class="travel">1 hr 5 min at hotel</span></div></div></div><div class="activity no-media"><div class="content"><div class="time">5:55–6:20 PM</div><h3>Drive to Carlsbad Village + park</h3><p>We'll head to the Village, park, and give ourselves a few minutes to walk to Wildland without arriving in a rush.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=2598+State+St+Carlsbad+CA+92008" target="_blank" rel="noopener">📍 Wildland · 2598 State St, Carlsbad, CA 92008</a><span class="travel">🚗 ≈25 min drive + parking buffer</span></div></div></div><div class="activity no-media"><div class="content"><div class="time">6:30–8:10 PM</div><h3>Wildland — rustic Italian date night</h3><p>We'll have a hearty, relaxed dinner built around rustic Italian cooking with a Southern California feel—pizza, pasta, and the kind of satisfying food that still feels special without turning dinner into a tasting-menu production.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=2598+State+St+Carlsbad+CA+92008" target="_blank" rel="noopener">📍 Wildland · 2598 State St, Carlsbad, CA 92008</a><span class="travel">Parked in Carlsbad Village</span></div><div class="pills"><a class="pill confirmed" href="https://www.wildlandallday.com/" target="_blank" rel="noopener">✅ Reservation confirmed · Wed Sep 16 · 6:30 PM · 2 guests · standard dining-room seating · 442-339-4812</a></div></div></div><div class="activity no-media"><div class="content"><div class="time">8:10–8:30 PM</div><h3>Wildland → Campfire transition</h3><p>They're extremely close together in Carlsbad Village, so we'll make this a relaxed walk/transition rather than getting back in the car and rushing.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=2725+State+St+Carlsbad+CA+92008" target="_blank" rel="noopener">📍 Campfire · 2725 State St, Carlsbad, CA 92008</a><span class="travel">Walk from Wildland</span></div></div></div><div class="activity"><div class="content"><div class="time">8:30–10:00 PM</div><h3>Campfire — nightcap drinks + dessert</h3><p>We'll keep the date going with cocktails and dessert on the heated patio instead of a full second dinner.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=2725+State+St+Carlsbad+CA+92008" target="_blank" rel="noopener">📍 Campfire · 2725 State St, Carlsbad, CA 92008</a><span class="travel">Walk from Wildland</span></div><div class="pills"><a class="pill confirmed" href="https://www.thisiscampfire.com/reserve" target="_blank" rel="noopener">✅ Reservation confirmed · Wed Sep 16 · 8:30 PM · 2 guests · outdoor heated-patio seating · drinks + dessert · 760-637-5121</a></div></div><div class="media"><img src="https://afar.brightspotcdn.com/dims4/default/0ba5a4f/2147483647/strip/false/crop/800x500%2B0%2B0/resize/800x500%21/quality/90/?url=https%3A%2F%2Fk3-prod-afar-media.s3.us-west-2.amazonaws.com%2Fbrightspot%2F98%2Fa4%2Fca2c31e5d731ac7021ed5af80c79%2Foriginal-efca2f636ac65ced2a5f48ac47417123.jpg" alt="Campfire — nightcap drinks + dessert" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&amp;fit=crop&amp;w=900&amp;q=80'"></div></div></div></section>'''

          thursday = '''<section class="day"><div class="dayhead"><div><div class="date">Thursday · September 17</div><h2>Wine country</h2></div><div class="dayicon">🍇</div></div><p class="weather"><strong>Weather:</strong> Sunny and notably hotter inland than the coast, with Temecula currently forecast around 89°F in the afternoon and mid-60s at night; build in water, shade and sunscreen throughout the winery day.</p><p class="note">Today’s assignment: spend an unreasonable number of hours surrounded by vineyards while looking effortlessly sophisticated.</p><div class="timeline"><div class="activity no-media"><div class="content"><div class="time">9:30–11:00 AM</div><h3>Drive to Temecula Valley Wine Country</h3><p>We'll leave Carlsbad after breakfast and drive into Temecula wine country, beginning at the quieter eastern end. The plan is to spend the day surrounded by vineyards and become the kind of people who say things like “the finish is lovely” without irony.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=36083+Summitville+St+Temecula+CA+92592" target="_blank" rel="noopener">📍 Doffo Winery · 36083 Summitville St, Temecula, CA 92592</a><span class="travel">🚗 60 min drive</span></div></div></div><div class="activity"><div class="content"><div class="time">11:00 AM–12:15 PM</div><h3>Doffo Winery + MotoDoffo Collection</h3><p>We'll start with a tasting, vineyard views, and a collection of vintage motorcycles sitting inside a winery because apparently wine country has a motorcycle subplot. It’s exactly the kind of delightfully weird opening act I want for us.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=36083+Summitville+St+Temecula+CA+92592" target="_blank" rel="noopener">📍 36083 Summitville St, Temecula, CA 92592</a><span class="travel">🚗 0 min drive</span></div><div class="pills"><a class="pill" href="https://doffowines.com/tastings/" target="_blank" rel="noopener">No reservation required for two · walk-ins welcome for groups of 1–7 · arrive at the 11:00 AM opening · 951-676-6989</a></div></div><div class="media"><img src="https://www.temeculawines.org/images/members/5/gallery/dsc02634.jpg" alt="Doffo Winery + MotoDoffo Collection" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&amp;fit=crop&amp;w=900&amp;q=80'"></div></div><div class="activity"><div class="content"><div class="time">12:15–1:45 PM</div><h3>The Cave Restaurant at Oak Mountain — wine-country lunch</h3><p>We'll have lunch underground among the barrels, which feels like the elegant version of hiding from our responsibilities. Then we’ll head into the cave and see how fancy we can make subterranean day drinking look.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=36522+Via+Verde+Temecula+CA+92592" target="_blank" rel="noopener">📍 Oak Mountain Winery · 36522 Vía Verde, Temecula, CA 92592</a><span class="travel">🚗 10 min drive</span></div><div class="pills"><a class="pill confirmed" href="https://oakmountainwinery.com/cave-restaurant/" target="_blank" rel="noopener">✅ Reservation confirmed · Thu Sep 17 · 12:30 PM · 2 guests · standard seating · 951-699-9102</a></div></div><div class="media"><img src="https://files.gigtown.com/980fc22deeedba7415fc83ddcb077736_ChIJA2WV4md424AROQmDfmzAGaY.jpg" alt="The Cave Restaurant at Oak Mountain — wine-country lunch" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&amp;fit=crop&amp;w=900&amp;q=80'"></div></div><div class="activity"><div class="content"><div class="time">1:45–3:15 PM</div><h3>Oak Mountain Cave Wine Tasting Tour</h3><p>We'll descend 104 feet beneath the vineyard for wine, meat, cheese, and the closest thing this trip has to a glamorous underground adventure. If I start referring to us as cave people, please know I mean it affectionately.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=36522+V%C3%ADa+Verde+Temecula+CA+92592" target="_blank" rel="noopener">📍 36522 Vía Verde, Temecula, CA 92592</a><span class="travel">🚗 0 min drive</span></div><div class="pills"><a class="pill reservation" href="https://oakmountainwinery.com/the-cave/" target="_blank" rel="noopener">Reservation required · 2:00 PM tour target · book for two · arrive 10–15 minutes early · confirm current price/format at checkout · 951-699-9102</a></div></div><div class="media"><img src="https://files.gigtown.com/980fc22deeedba7415fc83ddcb077736_ChIJA2WV4md424AROQmDfmzAGaY.jpg" alt="Oak Mountain Cave Wine Tasting Tour" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&amp;fit=crop&amp;w=900&amp;q=80'"></div></div><div class="activity"><div class="content"><div class="time">3:15–5:45 PM</div><h3>Oak Mountain vineyard decompression</h3><p>We'll slow down among the vineyards, drink some water, browse around, and let the afternoon be pleasantly unproductive. This is the part where I remind us that vacation is not a competitive sport, despite my suspicious itinerary.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=36522+V%C3%ADa+Verde+Temecula+CA+92592" target="_blank" rel="noopener">📍 36522 Vía Verde, Temecula, CA 92592</a><span class="travel">🚗 0 min drive</span></div></div><div class="media"><img src="https://files.gigtown.com/980fc22deeedba7415fc83ddcb077736_ChIJA2WV4md424AROQmDfmzAGaY.jpg" alt="Oak Mountain vineyard decompression" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&amp;fit=crop&amp;w=900&amp;q=80'"></div></div><div class="activity"><div class="content"><div class="time">5:45–6:30 PM</div><h3>Altísima Winery arrival + golden-hour transition</h3><p>We'll follow the wine trail to Altísima, get settled, and let golden hour turn the day into something a little more special. Basically, we’ll give ourselves a moment to look at each other and say, “This was a very good idea.”</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=37440+De+Portola+Rd+Temecula+CA+92592" target="_blank" rel="noopener">📍 Altísima Winery · 37440 De Portola Rd, Temecula, CA 92592</a><span class="travel">🚗 10 min from Oak Mountain</span></div></div><div class="media"><img src="https://gogrape.com/static/upload/wiki/1024x683_Altisima.jpg" alt="Altísima Winery arrival + golden-hour transition" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&amp;fit=crop&amp;w=900&amp;q=80'"></div></div><div class="activity"><div class="content"><div class="time">6:30–9:30 PM</div><h3>Noches de Altísima — Latin Jazz</h3><p>We'll finish wine country with live Latin jazz, Spanish-inspired atmosphere, wine, and little bites at Noches de Altísima. Less third tasting room, more accidentally glamorous couple who somehow found the best date in the valley.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=37440+De+Portola+Rd+Temecula+CA+92592" target="_blank" rel="noopener">📍 37440 De Portola Rd, Temecula, CA 92592</a><span class="travel">🚗 0 min drive</span></div><div class="pills"><a class="pill confirmed" href="https://altisimawinery.com/events/noches-latin-jazz/" target="_blank" rel="noopener">✅ TICKETS PURCHASED · Thu Sep 17 · 6:30–9:30 PM · 2 guests · 951-422-2525</a></div></div><div class="media"><img src="https://gogrape.com/static/upload/wiki/1024x683_Altisima.jpg" alt="Noches de Altísima — Latin Jazz" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&amp;fit=crop&amp;w=900&amp;q=80'"></div></div><div class="activity no-media"><div class="content"><div class="time">9:30–10:30 PM</div><h3>Return to Carlsbad</h3><p>We'll drive back to Carlsbad after the music and call it a night. After vineyards, cave wine, and Latin jazz, even a perfectly ordinary hotel room is going to feel like a luxury suite.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=1901+Wright+Pl+Carlsbad+CA+92008" target="_blank" rel="noopener">📍 Home2 Suites by Hilton Carlsbad · 1901 Wright Pl, Carlsbad, CA 92008</a><span class="travel">🚗 60 min drive</span></div></div></div></div></section>'''

          text = replace_day(text, 'Tuesday · September 15', 'Wednesday · September 16', tuesday)
          text = replace_day(text, 'Wednesday · September 16', 'Thursday · September 17', wednesday)
          text = replace_day(text, 'Thursday · September 17', 'Friday · September 18', thursday)

          # Reservation audit against explicit confirmations in the current Notion plan.
          must_have = [
              'Scenic Highway 101 drive to Carlsbad + hotel check-in',
              'Balboa Park golden-hour wander',
              'Little Italy wander',
              'Allegro — Amalfi Lemon Sorbet',
              'Night Hawk — open-air Greek date night',
              '✅ Reservation confirmed · Tue Sep 15 · 8:30 PM · 2 guests · outdoor seating',
              'Wildland — rustic Italian date night',
              '✅ Reservation confirmed · Wed Sep 16 · 6:30 PM · 2 guests · standard dining-room seating',
              'Campfire — nightcap drinks + dessert',
              '✅ Reservation confirmed · Wed Sep 16 · 8:30 PM · 2 guests · outdoor heated-patio seating',
              'The Cave Restaurant at Oak Mountain — wine-country lunch',
              '✅ Reservation confirmed · Thu Sep 17 · 12:30 PM · 2 guests · standard seating',
              'Oak Mountain Cave Wine Tasting Tour',
              'Reservation required · 2:00 PM tour target',
              'Oak Mountain vineyard decompression',
              '✅ TICKETS PURCHASED · Thu Sep 17 · 6:30–9:30 PM · 2 guests',
              '✅ BOOKED · Fri Sep 18 · 2:35 PM pickup · 2 Cruiser Bikes',
              '✅ Reservation confirmed · Fri Sep 18 · 7:15 PM · 2 guests · standard seating',
              '✅ Reservation confirmed · Sat Sep 19 · 12:30 PM · 2 guests · standard seating',
              '✅ Reservation confirmed · Sat Sep 19 · 9:00 PM · 2 guests · table seating',
              'Ticket required · buy General Admission, not RSVP-only',
              'Reservation required · 2:15 PM target',
          ]
          must_not_have = [
              'Carlsbad beach time</h3>',
              'Campfire — first-night dinner',
              'Jeune et Jolie — French date night',
              'Pechanga The Cove swim-up bar',
