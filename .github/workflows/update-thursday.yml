name: One-time Thursday nesting update

on:
  push:
    paths:
      - '.github/workflows/update-thursday.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Nest Thursday alternatives
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          if '<div class="choice-window">' in text:
              raise SystemExit('Thursday alternatives are already nested.')

          css_anchor = '.night-item{background:var(--night);border-color:#284455;color:#eef4f2}'
          css = '''.choice-window{position:relative;margin:0 0 22px;padding:16px;border:1px dashed #cbb894;background:#fbf6eb;border-radius:22px}.choice-window:before{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:var(--sun);left:-38px;top:25px;border:4px solid var(--paper);z-index:2}.choice-head{padding:2px 4px 14px}.choice-head h3{margin:0 0 6px;font-size:21px;line-height:1.25}.choice-head p{margin:0;color:#53686d}.choice-options{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.choice-option{padding:12px;border-radius:18px;border:1px solid #e2d8c6;background:#fffdf8}.choice-option.option-b{background:#f2f7f6;border-color:#d4e1de}.option-label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 10px;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--sea)}.option-label span{font-size:10px;letter-spacing:0;text-transform:none;font-weight:700;color:var(--muted)}.choice-option .activity{grid-template-columns:minmax(0,1fr) 145px;min-height:150px;margin:0 0 10px;box-shadow:none}.choice-option .activity:last-child{margin-bottom:0}.choice-option .activity:before{display:none}.choice-option .media{min-height:150px}.choice-option .media img{min-height:150px}.choice-option .content{padding:15px}.choice-option .activity h3{font-size:17px}.choice-option .activity p{font-size:13px}.choice-option .address,.choice-option .travel{font-size:11px!important}'''
          if css_anchor not in text:
              raise SystemExit('CSS anchor missing')
          text = text.replace(css_anchor, css + css_anchor, 1)

          mobile_anchor = '@media(max-width:820px){.intro{grid-template-columns:1fr}'
          mobile_repl = '@media(max-width:820px){.choice-options{grid-template-columns:1fr}.choice-window{padding:13px}.choice-window:before{left:-29px}.choice-option .activity{grid-template-columns:1fr}.choice-option .media{min-height:175px;border-radius:0 0 19px 19px}.choice-option .media img{min-height:175px;max-height:230px}.intro{grid-template-columns:1fr}'
          if mobile_anchor not in text:
              raise SystemExit('Mobile CSS anchor missing')
          text = text.replace(mobile_anchor, mobile_repl, 1)

          start_marker = '<div class="activity"><div class="content"><div class="time">12:15–1:45 PM</div><h3>The Cave Restaurant'
          end_marker = '<div class="activity"><div class="content"><div class="time">5:45–6:30 PM</div><h3>Altísima Winery'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          old = text[start:end]

          markers = [
              '<div class="activity"><div class="content"><div class="time">12:15–1:45 PM</div>',
              '<div class="activity"><div class="content"><div class="time">1:45–3:15 PM</div>',
              '<div class="activity"><div class="content"><div class="time">3:15–5:45 PM</div>',
              '<div class="activity"><div class="content"><div class="time">12:15–5:45 PM</div>'
          ]
          positions = [old.index(m) for m in markers] + [len(old)]
          cards = [old[positions[i]:positions[i+1]] for i in range(4)]

          cards[0] = cards[0].replace('🚗 10 min drive', '🚗 10 min from Doffo', 1)
          cards[3] = cards[3].replace('<h3>Alternative — Pechanga The Cove swim-up bar</h3>', '<h3>Pechanga The Cove swim-up bar</h3>', 1)
          cards[3] = cards[3].replace('Instead of the Oak Mountain lunch, cave tour, and vineyard decompression blocks above, we&#x27;ll drive from Doffo to Pechanga, spend the afternoon at the 4.5-acre pool oasis, then continue to Altísima before the evening event.', 'We&#x27;ll drive from Doffo to Pechanga, spend the afternoon at the 4.5-acre pool oasis, then continue to Altísima before the evening event.', 1)
          cards[3] = cards[3].replace('<span class="pill info">Alternative afternoon · replaces Oak Mountain lunch + cave tour + vineyard decompression</span>', '', 1)

          new = (
              '<div class="choice-window">'
              '<div class="choice-head"><div class="time">12:15–5:45 PM · Choose one route</div><h3>Wine-country afternoon — two alternatives</h3><p>Pick one of these mutually exclusive afternoon plans. Both routes reconverge at Altísima at 5:45 PM for golden hour and Latin jazz.</p></div>'
              '<div class="choice-options">'
              '<div class="choice-option option-a"><div class="option-label">Option A · Oak Mountain <span>Lunch + cave tour + vineyard</span></div>'
              + ''.join(cards[:3]) +
              '</div>'
              '<div class="choice-option option-b"><div class="option-label">Option B · Pechanga <span>Pool + swim-up bar</span></div>'
              + cards[3] +
              '</div>'
              '</div></div>'
          )

          text = text[:start] + new + text[end:]
          path.write_text(text)
      - name: Commit nested Thursday layout
        run: |
          git config user.name "trip-plan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Nest Thursday afternoon alternatives"
          git push
