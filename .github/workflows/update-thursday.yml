name: One-time nested subtimeline update

on:
  push:
    paths:
      - '.github/workflows/update-thursday.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Convert grouped stops to subtimelines
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          if 'class="subtimeline"' in text:
              raise SystemExit('Nested subtimelines are already present.')

          css_anchor = '.night-item{background:var(--night);border-color:#284455;color:#eef4f2}'
          css = '''.grouped-activity{overflow:hidden}.grouped-activity>.content,.grouped-activity>.media{align-self:stretch}.subtimeline{grid-column:1/-1;position:relative;margin:2px 18px 18px 46px;padding:4px 0 0 24px;border-left:2px solid #d7cec0}.substop{position:relative;background:#fbfaf6;border:1px solid #e7dfd3;border-radius:15px;padding:12px 14px;margin:0 0 10px;box-shadow:0 3px 10px rgba(40,50,50,.025)}.substop:last-child{margin-bottom:0}.substop:before{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:var(--sea);left:-30px;top:17px;border:3px solid var(--card)}.substop .time{font-size:10px;margin-bottom:3px}.substop h4{margin:0 0 4px;font-size:15px;line-height:1.3}.substop p{margin:0;color:#566b70;font-size:12px}.substop .meta{margin-top:7px}.substop .address,.substop .travel{font-size:11px!important}.substop .pills{margin-top:8px}.night-item .subtimeline{border-left-color:#496372}.night-item .substop{background:#1c3444;border-color:#35505f;box-shadow:none}.night-item .substop:before{background:#efaa70;border-color:var(--night)}.night-item .substop h4{color:#eef4f2}.night-item .substop p{color:#cbd8dc}.night-item .substop .time{color:#efb486}.night-item .substop .address,.night-item .substop .travel{color:#a9c1c7!important}'''
          if css_anchor not in text:
              raise SystemExit('CSS anchor missing')
          text = text.replace(css_anchor, css + css_anchor, 1)

          mobile_anchor = '@media(max-width:820px){.choice-options{grid-template-columns:1fr}'
          mobile_repl = '@media(max-width:820px){.subtimeline{margin:2px 13px 15px 30px;padding-left:18px}.substop:before{left:-24px}.choice-options{grid-template-columns:1fr}'
          if mobile_anchor not in text:
              raise SystemExit('Mobile CSS anchor missing')
          text = text.replace(mobile_anchor, mobile_repl, 1)

          bike_start_marker = '<div class="activity"><div class="content"><div class="time">2:15–5:20 PM</div><h3>Happy Hour Bike Tour — Harbor Island</h3>'
          bike_next_marker = '<div class="activity"><div class="content"><div class="time">5:20–6:05 PM</div><h3>Hyatt check-in + reset</h3>'
          bs = text.index(bike_start_marker)
          be = text.index(bike_next_marker, bs)
          bike_new = '''<div class="activity grouped-activity"><div class="content"><div class="time">2:15–5:20 PM</div><h3>Happy Hour Bike Tour — Harbor Island</h3><p>We&#x27;ll trade beach towels for bikes and cruise the waterfront from happy hour to happy hour. It’s an ambitious combination of exercise and cocktails, which means we can call the whole thing balanced.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=1355+N+Harbor+Dr+San+Diego+CA+92101" target="_blank" rel="noopener">📍 Wyndham San Diego Bayside · 1355 N Harbor Dr, San Diego, CA 92101</a><span class="travel">🚗 25 min drive</span></div><div class="pills"><span class="pill alert">Parking anchor · Wyndham public daily parking · current published rate $12/hour · confirm posted rate at entry</span></div></div><div class="media"><img src="https://wheelfunrentals.com/wp-content/uploads/2017/04/San-Diego-CA-Wyndham-San-Diego-Bayside-Family-on-Surrey-in-Downtown-640x800.jpg" alt="Happy Hour Bike Tour — Harbor Island" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80'"></div><div class="subtimeline"><div class="substop"><div class="time">2:35 PM</div><h4>Wheel Fun bike pickup</h4><p>Pick up our two pedal bikes at the Wyndham and get rolling along the waterfront.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=1355+N+Harbor+Dr+San+Diego+CA+92101" target="_blank" rel="noopener">📍 Wyndham San Diego Bayside · 1355 N Harbor Dr</a></div><div class="pills"><a class="pill reservation" href="https://wheelfunrentals.com/ca/san-diego/wyndham-san-diego-bayside/" target="_blank" rel="noopener">Reservation required · 2:35 PM pickup · 2 pedal bikes · Friday 9 AM–9 PM · advance booking saves 10% · 619-342-7244</a></div></div><div class="substop"><div class="time">2:50–3:20 PM</div><h4>Brigantine at Portside Pier</h4><p>Short first happy-hour stop before we settle into the longer Harbor Island portion of the ride.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=1360+N+Harbor+Dr+San+Diego+CA+92101" target="_blank" rel="noopener">📍 1360 N Harbor Dr, San Diego</a><span class="travel">Weekday happy hour 2–5 PM</span></div></div><div class="substop"><div class="time">3:20–3:35 PM</div><h4>Ride west to Tom Ham’s Lighthouse</h4><p>Bike along the waterfront to Harbor Island and lock the bikes at the restaurant.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=2150+Harbor+Island+Dr+San+Diego+CA+92101" target="_blank" rel="noopener">📍 Tom Ham’s Lighthouse · 2150 Harbor Island Dr</a></div></div><div class="substop"><div class="time">3:35–4:15 PM</div><h4>Tom Ham’s Lighthouse</h4><p>Drink + small bite with bay views during the confirmed weekday happy hour.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=2150+Harbor+Island+Dr+San+Diego+CA+92101" target="_blank" rel="noopener">📍 2150 Harbor Island Dr, San Diego</a><span class="travel">Happy hour 3–6 PM</span></div></div><div class="substop"><div class="time">4:15–4:25 PM</div><h4>Ride east to C Level Lounge</h4><p>Continue along Harbor Island for the final waterfront stop.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=880+Harbor+Island+Dr+San+Diego+CA+92101" target="_blank" rel="noopener">📍 C Level Lounge · 880 Harbor Island Dr</a></div></div><div class="substop"><div class="time">4:25–5:05 PM</div><h4>C Level Lounge</h4><p>Final happy-hour stop before turning the bikes back in.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=880+Harbor+Island+Dr+San+Diego+CA+92101" target="_blank" rel="noopener">📍 880 Harbor Island Dr, San Diego</a><span class="travel">Happy hour 3:30–5:30 PM</span></div></div><div class="substop"><div class="time">5:05–5:20 PM</div><h4>Bike return + car departure</h4><p>Return the bikes, collect the Porsche, and get out of downtown before evening traffic grows.</p><div class="pills"><span class="pill check">Return bikes on time · collect Porsche · depart downtown by 5:20 PM</span></div></div></div></div>'''
          text = text[:bs] + bike_new + text[be:]

          night_start_marker = '<div class="activity night-item"><div class="content"><div class="time">8:30 PM–2:25 AM</div><h3>Gaslamp Quarter — Demon Mode</h3>'
          ns = text.index(night_start_marker)
          boundary = '</div></div></div></section><section class="day"><div class="dayhead"><div><div class="date">Sunday · September 20</div>'
          bp = text.index(boundary, ns)
          ne = bp + len('</div></div>')
          night_new = '''<div class="activity night-item grouped-activity"><div class="content"><div class="time">8:30 PM–2:25 AM</div><h3>Gaslamp Quarter — Demon Mode</h3><p>We&#x27;ll park once, start with rooftop views, and then fully commit to NOVA and the dance floor. This is our official demon-mode chapter, so tomorrow morning’s version of us has been politely excluded from the planning meeting.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=614+Market+St+San+Diego+CA+92101" target="_blank" rel="noopener">📍 Park It On Market · 614 Market St, San Diego, CA 92101</a><span class="travel">🚗 20 min drive · park once for the full nightlife block</span></div></div><div class="media"><img src="https://images.discotech.me/venue/2879/c1550fe6-7ab0-4b0f-8b5f-669690b8b125.jpg?auto=format%2Ccompress" alt="Gaslamp Quarter — Demon Mode" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80'"></div><div class="subtimeline"><div class="substop"><div class="time">8:30–9:00 PM</div><h4>Coronado → Gaslamp + parking</h4><p>Drive downtown and use Park It On Market as the single 24-hour garage anchor for the entire nightlife block.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=614+Market+St+San+Diego+CA+92101" target="_blank" rel="noopener">📍 Park It On Market · 614 Market St</a></div></div><div class="substop"><div class="time">9:00–9:50 PM</div><h4>The Rooftop by STK at Andaz</h4><p>Start the night with skyline views and a lively rooftop atmosphere before walking to NOVA.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=600+F+St+San+Diego+CA+92101" target="_blank" rel="noopener">📍 600 F St, San Diego</a><span class="travel">3 min walk from garage · Saturday service until midnight</span></div><div class="pills"><a class="pill reservation" href="https://www.hyatt.com/andaz/en-US/sanas-andaz-san-diego/dining/the-rooftop-by-stk" target="_blank" rel="noopener">Reservation required · 9:00 PM target · 619-814-2002</a></div></div><div class="substop"><div class="time">9:50–10:00 PM</div><h4>Walk to NOVA SD</h4><p>Leave the rooftop on time and walk two minutes to NOVA.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=454+Sixth+Ave+San+Diego+CA+92101" target="_blank" rel="noopener">📍 NOVA SD · 454 Sixth Ave</a><span class="travel">2 min walk</span></div></div><div class="substop"><div class="time">10:00 PM–2:00 AM</div><h4>NOVA SD — Time Machine</h4><p>90s–2000s Throwback Dance Party and the official full-send portion of the evening.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=454+Sixth+Ave+San+Diego+CA+92101" target="_blank" rel="noopener">📍 454 Sixth Ave, San Diego</a></div><div class="pills"><a class="pill ticket" href="https://www.ticketweb.com/event/time-machine-90s-nova-sd-tickets/15024513" target="_blank" rel="noopener">Ticket required · buy General Admission, not RSVP-only · RSVP does not guarantee entry · authorized TicketWeb/TIXR only</a><span class="pill check">21+ · cashless · government ID must match ticket name</span></div></div><div class="substop"><div class="time">2:00–2:25 AM</div><h4>Retrieve car + return to Hyatt</h4><p>Head straight back to Park It On Market, collect the car, and return to the Hyatt.</p><div class="meta"><span class="travel">🚗 20 min drive to Hyatt</span></div><div class="pills"><span class="pill check">Leave NOVA at 2:00 AM · retrieve car · return directly to Hyatt</span></div></div></div></div>'''
          text = text[:ns] + night_new + text[ne:]

          path.write_text(text)
      - name: Commit nested subtimelines
        run: |
          git config user.name "trip-plan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Format bike tour and Gaslamp stops as subtimelines"
          git push
