name: Sync confirmed reservations

on:
  push:
    paths:
      - '.github/workflows/update-thursday.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark confirmed reservations in itinerary
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          replacements = {
              'Reservation required · 7:15 PM target · dinner daily 4:30–8:30 PM · 858-454-5888':
                  'Reservation confirmed · Fri Sep 18 · 7:15 PM · 2 guests · standard seating',
              'Reservation required · 12:30 PM target · advance reservations highly recommended · 858-289-0676':
                  'Reservation confirmed · Sat Sep 19 · 12:30 PM · 2 guests · standard seating',
              'Reservation required · 9:00 PM target · 619-814-2002':
                  'Reservation confirmed · Sat Sep 19 · 9:00 PM · 2 guests · table seating',
          }

          changed = False
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
              elif new not in text:
                  raise SystemExit(f'Could not find expected reservation text: {old}')

          if not changed:
              raise SystemExit('Reservations are already up to date.')

          path.write_text(text)

      - name: Commit itinerary updates
        run: |
          git config user.name "trip-plan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Mark Duke's, Teleferic and Rooftop reservations confirmed"
          git push
