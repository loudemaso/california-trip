name: Sync latest itinerary

on:
  push:
    paths:
      - ".github/workflows/sync-latest-itinerary.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply itinerary updates
        run: python3 scripts/sync_latest_trip.py
      - name: Commit itinerary updates
        run: |
          git config user.name "trip-plan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "The live itinerary is already synchronized."
            exit 0
          fi
          git commit -m "Sync latest trip confirmations and status pills"
          git push origin main
