name: Sync latest itinerary changes

on:
  push:
    paths:
      - '.github/workflows/sync-latest-itinerary.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch live itinerary and persistent sync source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          text = index.read_text()

          if '.pill.confirmed{' not in text:
              text = text.replace(
                  '.pill.reservation{background:#fff0e4;color:#8d512e;border-color:#f1d2bc}',
                  '.pill.reservation{background:#fff0e4;color:#8d512e;border-color:#f1d2bc}.pill.confirmed{background:#e8f4eb;color:#237a43;border-color:#c9e4d2}',
                  1,
              )

          old = '<a class="pill reservation" href="https://oakmountainwinery.com/cave-restaurant/" target="_blank" rel="noopener">Reservation required · 12:30 PM lunch target · reserve an indoor Cave Restaurant table for two · Thursday 12:00–8:00 PM · 951-699-9102</a>'
          new = '<a class="pill confirmed" href="https://oakmountainwinery.com/cave-restaurant/" target="_blank" rel="noopener">✅ Reservation confirmed · Thu Sep 17 · 12:30 PM · 2 guests · standard seating · 951-699-9102</a>'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Could not update Cave Restaurant confirmation')

          old = '<a class="pill ticket" href="https://altisimawinery.com/events/noches-latin-jazz/" target="_blank" rel="noopener">Tickets required · Thu Sep 17 · 6:30–9:30 PM · $25/person published admission · limited seating · non-refundable · 951-422-2525</a>'
          new = '<a class="pill confirmed" href="https://altisimawinery.com/events/noches-latin-jazz/" target="_blank" rel="noopener">✅ TICKETS PURCHASED · Thu Sep 17 · 6:30–9:30 PM · 2 guests · 951-422-2525</a>'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Could not update Noches de Altísima confirmation')

          confirmed = re.compile(r'<a class="pill reservation"([^>]*)>(?:✅\s*)?(Reservation confirmed|BOOKED)([^<]*)</a>')
          text = confirmed.sub(lambda m: f'<a class="pill confirmed"{m.group(1)}>✅ {m.group(2)}{m.group(3)}</a>', text)
          index.write_text(text)

          def extract_day(html, date_label, next_date_label):
              start = html.find(f'<section class="day"><div class="dayhead"><div><div class="date">{date_label}</div>')
              end = html.find(f'<section class="day"><div class="dayhead"><div><div class="date">{next_date_label}</div>', start)
              if start == -1 or end == -1:
                  raise SystemExit(f'Could not extract {date_label}')
              return html[start:end]

          source = Path('.github/workflows/update-thursday.yml')
          s = source.read_text()

          for var, date_label, next_label in [
              ('tuesday', 'Tuesday · September 15', 'Wednesday · September 16'),
              ('wednesday', 'Wednesday · September 16', 'Thursday · September 17'),
              ('thursday', 'Thursday · September 17', 'Friday · September 18'),
          ]:
              section = extract_day(text, date_label, next_label)
              start_marker = f"          {var} = '''"
              start = s.find(start_marker)
              if start == -1:
                  raise SystemExit(f'Could not find {var} assignment')
              body_start = start + len(start_marker)
              end = s.find("'''", body_start)
              if end == -1:
                  raise SystemExit(f'Could not find end of {var} assignment')
              s = s[:body_start] + section + s[end:]

          must_start = s.find('          must_have = [')
          must_end = s.find('          must_not_have = [', must_start)
          if must_start == -1 or must_end == -1:
              raise SystemExit('Could not find reservation audit block')

          new_must = """          must_have = [
              'Scenic Highway 101 drive to Carlsbad + hotel check-in',
              'Balboa Park golden-hour wander',
              'Little Italy wander',
              'Allegro — Amalfi Lemon Sorbet',
              'Night Hawk — open-air Greek date night',
              '✅ Reservation confirmed · Tue Sep 15 · 8:30 PM · 2 guests · outdoor seating',
              'Wildland — rustic Italian date night',
              '✅ Reservation confirmed · Wed Sep 16 · 6:30 PM · 2 guests · standard dining-room seating',
              'Campfire — nightcap drinks + dessert',
              '✅ Reservation confirmed · Wed Sep 16 · 8:30 PM · 2 guests · outdoor heated-patio seating',
              'The Cave Restaurant at Oak Mountain — wine-country lunch',
              '✅ Reservation confirmed · Thu Sep 17 · 12:30 PM · 2 guests · standard seating',
              'Oak Mountain Cave Wine Tasting Tour',
              'Reservation required · 2:00 PM tour target',
              'Oak Mountain vineyard decompression',
              '✅ TICKETS PURCHASED · Thu Sep 17 · 6:30–9:30 PM · 2 guests',
              '✅ BOOKED · Fri Sep 18 · 2:35 PM pickup · 2 Cruiser Bikes',
              '✅ Reservation confirmed · Fri Sep 18 · 7:15 PM · 2 guests · standard seating',
              '✅ Reservation confirmed · Sat Sep 19 · 12:30 PM · 2 guests · standard seating',
              '✅ Reservation confirmed · Sat Sep 19 · 9:00 PM · 2 guests · table seating',
              'Ticket required · buy General Admission, not RSVP-only',
              'Reservation required · 2:15 PM target',
          ]
"""
          s = s[:must_start] + new_must + s[must_end:]
          source.write_text(s)
          PY

      - name: Commit synchronized itinerary
        run: |
          git config user.name "trip-plan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-thursday.yml
          if git diff --cached --quiet; then
            echo "Everything is already synchronized."
            exit 0
          fi
          git commit -m "Sync latest trip confirmations and status pills"
          git push origin main
