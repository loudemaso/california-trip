name: Move Night Hawk to Tuesday

on:
  push:
    paths:
      - '.github/workflows/move-nighthawk-tuesday.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move Night Hawk reservation and persist itinerary source
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_activity(text, title, replacement):
              marker = f'<h3>{title}</h3>'
              pos = text.find(marker)
              if pos == -1:
                  raise SystemExit(f'Could not find activity: {title}')
              start = text.rfind('<div class="activity', 0, pos)
              if start == -1:
                  raise SystemExit(f'Could not find activity wrapper: {title}')
              depth = 0
              end = None
              for match in re.finditer(r'<div\b[^>]*>|</div>', text[start:]):
                  if match.group(0).startswith('<div'):
                      depth += 1
                  else:
                      depth -= 1
                      if depth == 0:
                          end = start + match.end()
                          break
              if end is None:
                  raise SystemExit(f'Could not parse activity wrapper: {title}')
              return text[:start] + replacement + text[end:]

          little_italy = '''<div class="activity"><div class="content"><div class="time">6:35–7:35 PM</div><h3>Little Italy wander</h3><p>We'll stroll India Street and the piazzas, browse whatever catches our attention, and soak up the neighborhood before our later dinner reservation in Coronado.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=India+St+and+W+Date+St+San+Diego+CA+92101" target="_blank" rel="noopener">📍 India St &amp; W Date St, San Diego, CA 92101</a><span class="travel">Park once · explore on foot</span></div></div><div class="media"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Little%20Italy%2C%20San%20Diego.jpg?width=1200" alt="Little Italy in San Diego" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&amp;fit=crop&amp;w=900&amp;q=80'"></div></div>'''

          allegro = '''<div class="activity"><div class="content"><div class="time">7:35–7:55 PM</div><h3>Allegro — Amalfi Lemon Sorbet</h3><p>We'll make the delightfully questionable decision to have the photogenic Amalfi-style lemon sorbet before dinner, then head for Coronado.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=1536+India+St+San+Diego+CA+92101" target="_blank" rel="noopener">📍 Allegro Restaurant and Bar · 1536 India St, San Diego, CA 92101</a><span class="travel">Walk within Little Italy</span></div></div><div class="media"><img src="https://cdn.res-menu.net/allegro-restaurant-and-bar/albums-1.jpg" alt="Allegro lemon garden dining room in Little Italy" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&amp;fit=crop&amp;w=900&amp;q=80'"></div></div>'''

          night_hawk_tuesday = '''<div class="activity no-media"><div class="content"><div class="time">7:55–8:25 PM</div><h3>Drive Little Italy → Night Hawk + arrival buffer</h3><p>We'll cross over to Coronado with enough time to park or use valet and make the reservation without rushing.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=1315+Orange+Ave+Coronado+CA+92118" target="_blank" rel="noopener">📍 Night Hawk · 1315 Orange Ave, Coronado, CA 92118</a><span class="travel">≈20 min drive + arrival buffer</span></div></div></div><div class="activity"><div class="content"><div class="time">8:30–10:00 PM</div><h3>Night Hawk — open-air Greek date night</h3><p>We'll settle into the outdoor dining room for a late Greek dinner and let the first night finish somewhere atmospheric instead of trying to squeeze in another neighborhood.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=1315+Orange+Ave+Coronado+CA+92118" target="_blank" rel="noopener">📍 Night Hawk · 1315 Orange Ave, Coronado, CA 92118</a></div><div class="pills"><a class="pill reservation" href="https://www.thebabygrandcoronado.com/night-hawk" target="_blank" rel="noopener">✅ Reservation confirmed · Tue Sep 15 · 8:30 PM · 2 guests · outdoor seating</a></div></div><div class="media"><img src="https://www.thebabygrandcoronado.com/_vercel/image?q=90&amp;url=https%3A%2F%2Fcms.thebabygrandcoronado.com%2Fuploads%2Fnhk1.jpg&amp;w=640" alt="Night Hawk — open-air Greek date night" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&amp;fit=crop&amp;w=900&amp;q=80'"></div></div><div class="activity no-media"><div class="content"><div class="time">10:00–10:50 PM</div><h3>Drive Night Hawk → Carlsbad hotel</h3><p>After dinner, we'll head straight back to Home2 Suites and call it a very respectable first day.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=1901+Wright+Pl+Carlsbad+CA+92008" target="_blank" rel="noopener">📍 Home2 Suites by Hilton Carlsbad · 1901 Wright Pl, Carlsbad, CA 92008</a><span class="travel">≈50 min drive</span></div></div></div>'''

          coronado = '''<div class="activity"><div class="content"><div class="time">5:00–8:30 PM</div><h3>Coronado Village + Hotel del sunset stroll + spontaneous dinner</h3><p>We'll drive to Coronado, wander toward Hotel del and Central Beach for golden hour, then keep the evening flexible and choose dinner somewhere in the Village before heading downtown. It’s a scenic, low-pressure bridge between the afternoon hike and demon mode.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=1500+Orange+Ave+Coronado+CA+92118" target="_blank" rel="noopener">📍 Hotel del Coronado · 1500 Orange Ave, Coronado, CA 92118</a><span class="travel">🚗 35 min drive</span></div><div class="pills"><span class="pill alert">Parking note · avoid Hotel del visitor garage unless needed · day-visitor self-parking starts at $39 for first 2 hours · prioritize legal street/residential parking + walking buffer</span></div></div><div class="media"><img src="https://img.sunset02.com/sites/default/files/image/2016/08/main/hotel-del-coronado.jpg" alt="Coronado Village + Hotel del sunset stroll + spontaneous dinner" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&amp;fit=crop&amp;w=900&amp;q=80'"></div></div>'''

          old_note = 'Day-one energy: land, acquire Porsche, then head downtown for architecture, wandering, Italian food, and a very specific lemon-shaped dessert mission.'
          new_note = 'Day-one energy: land, acquire Porsche, then head downtown for architecture, wandering, a very specific lemon-shaped dessert mission, and a late Greek dinner in Coronado.'

          # Update the live HTML, including removing Night Hawk from Saturday.
          index = Path('index.html')
          text = index.read_text()
          text = text.replace(old_note, new_note, 1)
          text = replace_activity(text, 'Night Hawk — open-air Greek date night', '')
          text = replace_activity(text, 'Coronado Village + Hotel del sunset stroll', coronado)
          text = replace_activity(text, 'Little Italy wander + spontaneous dinner', little_italy)
          text = replace_activity(text, 'Allegro — Amalfi Lemon Sorbet', allegro)
          text = replace_activity(text, 'Drive Little Italy → Carlsbad hotel', night_hawk_tuesday)
          index.write_text(text)

          # Persist the Tuesday changes in the Notion-sync source workflow.
          source = Path('.github/workflows/update-thursday.yml')
          text = source.read_text()
          text = text.replace(old_note, new_note, 1)
          text = replace_activity(text, 'Little Italy wander + spontaneous dinner', little_italy)
          text = replace_activity(text, 'Allegro — Amalfi Lemon Sorbet', allegro)
          text = replace_activity(text, 'Drive Little Italy → Carlsbad hotel', night_hawk_tuesday)
          source.write_text(text)

          # Keep the image-preservation workflow compatible with the renamed Tuesday card.
          image_workflow = Path('.github/workflows/tuesday-images.yml')
          text = image_workflow.read_text()
          text = text.replace("'Little Italy wander + spontaneous dinner'", "'Little Italy wander'")
          image_workflow.write_text(text)

      - name: Commit itinerary move
        run: |
          git config user.name "trip-plan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-thursday.yml .github/workflows/tuesday-images.yml
          if git diff --cached --quiet; then
            echo "Night Hawk move already applied."
            exit 0
          fi
          git commit -m "Move Night Hawk reservation to Tuesday"
          git push origin main
