name: Sync Thursday Europa itinerary

on:
  push:
    paths:
      - '.github/workflows/sync-thursday-europa.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Thursday itinerary
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()
          start_marker = '<section class="day"><div class="dayhead"><div><div class="date">Thursday · September 17</div>'
          next_marker = '<section class="day"><div class="dayhead"><div><div class="date">Friday · September 18</div>'
          start = s.find(start_marker)
          end = s.find(next_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Could not locate Thursday section')

          thursday = '''<section class="day"><div class="dayhead"><div><div class="date">Thursday · September 17</div><h2>Wine country</h2></div><div class="dayicon">🍇</div></div><p class="weather"><strong>Weather:</strong> Sunny and notably hotter inland than the coast, with Temecula currently forecast around 89°F in the afternoon and mid-60s at night; build in water, shade and sunscreen throughout the winery day.</p><p class="note">Today’s assignment: spend an unreasonable number of hours surrounded by vineyards while looking effortlessly sophisticated.</p><div class="timeline"><div class="activity no-media"><div class="content"><div class="time">9:30–11:00 AM</div><h3>Drive to Temecula Valley Wine Country</h3><p>We'll leave Carlsbad after breakfast and drive into Temecula wine country, beginning at the quieter eastern end. The plan is to spend the day surrounded by vineyards and become the kind of people who say things like “the finish is lovely” without irony.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=36083+Summitville+St+Temecula+CA+92592" target="_blank" rel="noopener">📍 Doffo Winery · 36083 Summitville St, Temecula, CA 92592</a><span class="travel">🚗 60 min drive</span></div></div></div><div class="activity"><div class="content"><div class="time">11:00 AM–12:15 PM</div><h3>Doffo Winery + MotoDoffo Collection</h3><p>We'll start with a tasting, vineyard views, and a collection of vintage motorcycles sitting inside a winery because apparently wine country has a motorcycle subplot. It’s exactly the kind of delightfully weird opening act I want for us.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=36083+Summitville+St+Temecula+CA+92592" target="_blank" rel="noopener">📍 36083 Summitville St, Temecula, CA 92592</a><span class="travel">🚗 0 min drive</span></div><div class="pills"><a class="pill" href="https://doffowines.com/tastings/" target="_blank" rel="noopener">No reservation required for two · walk-ins welcome for groups of 1–7 · arrive at the 11:00 AM opening · 951-676-6989</a></div></div><div class="media"><img src="https://www.temeculawines.org/images/members/5/gallery/dsc02634.jpg" alt="Doffo Winery + MotoDoffo Collection" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1506377247377-2a5b3b417ebb?auto=format&amp;fit=crop&amp;w=900&amp;q=80'"></div></div><div class="activity"><div class="content"><div class="time">12:15–1:45 PM</div><h3>The Cave Restaurant at Oak Mountain — wine-country lunch</h3><p>We'll have lunch underground among the barrels, which feels like the elegant version of hiding from our responsibilities. After lunch, we'll stay above ground and explore the property rather than doing the Oak Mountain wine tour.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=36522+Via+Verde+Temecula+CA+92592" target="_blank" rel="noopener">📍 Oak Mountain Winery · 36522 Vía Verde, Temecula, CA 92592</a><span class="travel">🚗 10 min drive</span></div><div class="pills"><a class="pill confirmed" href="https://oakmountainwinery.com/cave-restaurant/" target="_blank" rel="noopener">✅ Reservation confirmed · Thu Sep 17 · 12:30 PM · 2 guests · standard seating · 951-699-9102</a></div></div><div class="media"><img src="https://files.gigtown.com/980fc22deeedba7415fc83ddcb077736_ChIJA2WV4md424AROQmDfmzAGaY.jpg" alt="The Cave Restaurant at Oak Mountain Winery" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1506377247377-2a5b3b417ebb?auto=format&amp;fit=crop&amp;w=900&amp;q=80'"></div></div><div class="activity"><div class="content"><div class="time">1:45–2:40 PM</div><h3>Explore Oak Mountain Winery grounds</h3><p>After lunch in the cave, we'll stay above ground this time—wander the property, take in the vineyard views, hydrate, and enjoy a relaxed stretch before heading to our next winery.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=36522+Via+Verde+Temecula+CA+92592" target="_blank" rel="noopener">📍 Oak Mountain Winery · 36522 Vía Verde, Temecula, CA 92592</a><span class="travel">🚗 0 min drive</span></div></div><div class="media"><img src="https://files.gigtown.com/980fc22deeedba7415fc83ddcb077736_ChIJA2WV4md424AROQmDfmzAGaY.jpg" alt="Oak Mountain Winery vineyard grounds" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1506377247377-2a5b3b417ebb?auto=format&amp;fit=crop&amp;w=900&amp;q=80'"></div></div><div class="activity no-media"><div class="content"><div class="time">2:40–3:00 PM</div><h3>Drive Oak Mountain → Europa Village + tour check-in</h3><p>We'll leave enough time to get over to Europa Village, park, and check in without rushing.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=41150+Via+Europa+Temecula+CA+92591" target="_blank" rel="noopener">📍 Europa Village Winery and Resort · 41150 Via Europa, Temecula, CA 92591</a><span class="travel">🚗 ≈20 min including parking/check-in</span></div></div></div><div class="activity"><div class="content"><div class="time">3:00–4:30 PM</div><h3>Europa Village Winery Tour</h3><p>We'll spend the afternoon touring Europa Village and getting a deeper look at the winery before the evening portion of the day.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=41150+Via+Europa+Temecula+CA+92591" target="_blank" rel="noopener">📍 Europa Village Winery and Resort · 41150 Via Europa, Temecula, CA 92591</a></div><div class="pills"><span class="pill confirmed">✅ Reservation confirmed · Thu Sep 17 · 3:00–4:30 PM · 2 guests · confirmation CURBIAVC</span></div></div><div class="media"><img src="https://images.unsplash.com/photo-1506377247377-2a5b3b417ebb?auto=format&amp;fit=crop&amp;w=900&amp;q=80" alt="Temecula wine country winery tour" loading="lazy" decoding="async"></div></div><div class="activity no-media"><div class="content"><div class="time">4:30–5:40 PM</div><h3>Europa Village post-tour wander + reset</h3><p>We'll linger around the property after the tour, take a breather, drink some water, and enjoy the setting before heading to Altísima for the evening.</p></div></div><div class="activity no-media"><div class="content"><div class="time">5:40–6:00 PM</div><h3>Drive Europa Village → Altísima Winery</h3><p>We'll head out with the goal of arriving around 6:00 PM, giving ourselves a comfortable 30-minute cushion before Noches de Altísima begins at 6:30.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=37440+De+Portola+Rd+Temecula+CA+92592" target="_blank" rel="noopener">📍 Altísima Winery · 37440 De Portola Rd, Temecula, CA 92592</a><span class="travel">🚗 ≈20 min drive</span></div></div></div><div class="activity"><div class="content"><div class="time">6:00–6:30 PM</div><h3>Altísima arrival + golden-hour transition</h3><p>We'll arrive early, get settled, and enjoy a little golden-hour breathing room before the music starts.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=37440+De+Portola+Rd+Temecula+CA+92592" target="_blank" rel="noopener">📍 Altísima Winery · 37440 De Portola Rd, Temecula, CA 92592</a><span class="travel">30 min arrival cushion</span></div></div><div class="media"><img src="https://gogrape.com/static/upload/wiki/1024x683_Altisima.jpg" alt="Altísima Winery at golden hour" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1506377247377-2a5b3b417ebb?auto=format&amp;fit=crop&amp;w=900&amp;q=80'"></div></div><div class="activity"><div class="content"><div class="time">6:30–9:30 PM</div><h3>Noches de Altísima — Latin Jazz</h3><p>We'll finish wine country with live Latin jazz, Spanish-inspired atmosphere, wine, and little bites at Noches de Altísima. Less third tasting room, more accidentally glamorous couple who somehow found the best date in the valley.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=37440+De+Portola+Rd+Temecula+CA+92592" target="_blank" rel="noopener">📍 37440 De Portola Rd, Temecula, CA 92592</a><span class="travel">🚗 0 min drive</span></div><div class="pills"><a class="pill confirmed" href="https://altisimawinery.com/events/noches-latin-jazz/" target="_blank" rel="noopener">✅ TICKETS PURCHASED · Thu Sep 17 · 6:30–9:30 PM · 2 guests · 951-422-2525</a></div></div><div class="media"><img src="https://gogrape.com/static/upload/wiki/1024x683_Altisima.jpg" alt="Noches de Altísima — Latin Jazz" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1506377247377-2a5b3b417ebb?auto=format&amp;fit=crop&amp;w=900&amp;q=80'"></div></div><div class="activity no-media"><div class="content"><div class="time">9:30–10:30 PM</div><h3>Return to Carlsbad</h3><p>We'll drive back to Carlsbad after the music and call it a night. After vineyards, a cave lunch, a winery tour, and Latin jazz, even a perfectly ordinary hotel room is going to feel like a luxury suite.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=1901+Wright+Pl+Carlsbad+CA+92008" target="_blank" rel="noopener">📍 Home2 Suites by Hilton Carlsbad · 1901 Wright Pl, Carlsbad, CA 92008</a><span class="travel">🚗 60 min drive</span></div></div></div></div></section>'''

          s = s[:start] + thursday + s[end:]
          p.write_text(s)
      - name: Commit updated Thursday
        run: |
          if git diff --quiet -- index.html; then
            echo "Thursday already current."
            exit 0
          fi
          git config user.name "trip-plan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update Thursday for Europa Village tour"
          git push origin main
