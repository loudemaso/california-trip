name: Preserve Wednesday Live Scan

on:
  workflow_run:
    workflows:
      - 'Sync Notion itinerary'
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve confirmed Wednesday Live Scan stop
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          old_fingerprint = '''<div class="activity no-media"><div class="content"><div class="time">8:50–10:00 AM</div><h3>California sales-license fingerprinting</h3><p>I'll handle the responsible-adult portion of the morning and get my fingerprints taken while you bravely support my brief career as a person with paperwork. Then we'll be free to return to vacation behavior.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=2888+Loker+Ave+E+Suite+110+Carlsbad+CA+92010" target="_blank" rel="noopener">📍 2888 Loker Ave E, Suite 110, Carlsbad, CA 92010</a><span class="travel">🚗 5 min drive</span></div><div class="pills"><span class="pill check">Confirm before the trip · bring valid government-issued photo ID + completed Request for Live Scan Service form · appointment/time still needs final confirmation · 442-200-1099</span></div></div></div>'''

          new_fingerprint = '''<div class="activity no-media"><div class="content"><div class="time">8:50–10:00 AM</div><h3>California sales-license Live Scan fingerprinting — The UPS Store Village Faire</h3><p>We'll head into Carlsbad Village for my Live Scan fingerprinting at The UPS Store Village Faire. I called the store directly and confirmed they accept walk-in Live Scan fingerprinting, so no appointment is needed.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=300+Carlsbad+Village+Dr+Ste+108A+Carlsbad+CA+92008" target="_blank" rel="noopener">📍 The UPS Store Village Faire · 300 Carlsbad Village Dr, Ste 108A, Carlsbad, CA 92008</a><span class="travel">🚗 ≈10 min drive</span></div><div class="pills"><a class="pill check" href="https://locations.theupsstore.com/ca/carlsbad/300-carlsbad-village-dr" target="_blank" rel="noopener">Walk-in Live Scan confirmed by phone · no appointment required · 760-434-9933 · UPS Store page</a><span class="pill check">Bring government-issued photo ID + completed Request for Live Scan Service form</span></div></div></div>'''

          old_breakfast = '''<div class="activity no-media"><div class="content"><div class="time">10:00 AM–12:45 PM</div><h3>Breakfast + flexible Carlsbad time</h3><p>We'll have a slow breakfast and let the morning breathe instead of cramming in another attraction. This is our official window for coffee, wandering, and pretending we don't have a timeshare presentation later.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=1901+Wright+Pl+Carlsbad+CA+92008" target="_blank" rel="noopener">📍 Home2 Suites by Hilton Carlsbad · 1901 Wright Pl, Carlsbad, CA 92008</a><span class="travel">🚗 5 min drive</span></div></div></div>'''

          new_breakfast = '''<div class="activity no-media"><div class="content"><div class="time">10:00 AM–12:45 PM</div><h3>Breakfast + flexible Carlsbad time</h3><p>We'll have a slow breakfast and let the morning breathe instead of cramming in another attraction. This is our official window for coffee, wandering, and pretending we don't have a timeshare presentation later.</p><div class="meta"><a class="address" href="https://www.google.com/maps/search/?api=1&amp;query=1901+Wright+Pl+Carlsbad+CA+92008" target="_blank" rel="noopener">📍 Home2 Suites by Hilton Carlsbad · 1901 Wright Pl, Carlsbad, CA 92008</a><span class="travel">🚗 ≈10 min from The UPS Store Village Faire</span></div></div></div>'''

          changed = False
          if old_fingerprint in text:
              text = text.replace(old_fingerprint, new_fingerprint)
              changed = True
          elif new_fingerprint not in text:
              raise SystemExit('Fingerprint block not found')

          if old_breakfast in text:
              text = text.replace(old_breakfast, new_breakfast)
              changed = True
          elif new_breakfast not in text:
              raise SystemExit('Breakfast block not found')

          if changed:
              path.write_text(text)

      - name: Commit if needed
        run: |
          if git diff --quiet -- index.html; then
            echo "Live Scan stop already current."
            exit 0
          fi
          git config user.name "trip-plan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Preserve Wednesday Live Scan stop"
          git push origin main
